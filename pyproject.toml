[project]
name = "jevstiller"
version = "0.1.0"
description = "Distill a repeated Jev classification task into a local model, on the fly — same answers, your hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tomer Glick" }]
keywords = ["jev", "typesafe", "distillation", "classification", "mlops", "model-cascade", "knowledge-distillation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
onnx = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
gpu = ["onnxruntime-gpu>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
torch = ["torch>=2.1", "transformers>=4.36"]
all = ["jevstiller[jev,onnx,torch]"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/tomerglick57/Jevstiller"
Repository = "https://github.com/tomerglick57/Jevstiller"
Issues = "https://github.com/tomerglick57/Jevstiller/issues"
Design = "https://github.com/tomerglick57/Jevstiller/blob/main/DESIGN.md"
Changelog = "https://github.com/tomerglick57/Jevstiller/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevstiller"]

[tool.hatch.build.targets.sdist]
include = ["jevstiller", "tests", "README.md", "LICENSE", "DESIGN.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501"]
"tests/*" = ["E501"]
