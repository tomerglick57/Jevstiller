[project]
name = "jevstiller"
version = "0.1.0"
description = "Distill a repeated Jev classification task into a local model, on the fly — same answers, your hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tomer Glick" }]
keywords = ["jev", "typesafe", "distillation", "classification", "mlops", "model-cascade", "knowledge-distillation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.1"]
# floors: no known advisories at these versions (pip-audit, 2026-09-25); CI tests the lowest ones
server = ["starlette>=1.3.1", "uvicorn>=0.31", "h11>=0.16", "anyio>=4.14.2", "httpx>=0.27",
          "tomli>=2; python_version < '3.11'"]
onnx = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
gpu = ["onnxruntime-gpu>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
torch = ["torch>=2.1", "transformers>=4.36"]
all = ["jevstiller[jev,server,onnx,torch]"]
dev = ["pytest>=7", "ruff>=0.4", "jevstiller[jev,server]"]

[project.scripts]
jevstiller = "jevstiller.cli:main"

[project.urls]
Homepage = "https://jevstiller.pages.dev"
Documentation = "https://jevstiller.pages.dev/getting-started/"
Repository = "https://github.com/tomerglick57/Jevstiller"
Issues = "https://github.com/tomerglick57/Jevstiller/issues"
Design = "https://github.com/tomerglick57/Jevstiller/blob/main/DESIGN.md"
Changelog = "https://github.com/tomerglick57/Jevstiller/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevstiller"]

[tool.hatch.build.targets.sdist]
include = ["/jevstiller", "/tests", "/README.md", "/LICENSE", "/DESIGN.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (run with JEVSTILLER_LIVE=1 and TYPESAFE_API_KEY set)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501"]
"benchmarks/*" = ["E501"]
"tests/*" = ["E501"]
