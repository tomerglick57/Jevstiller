[project]
name = "jevstiller"
version = "0.3.1"
description = "Distill a repeated Jev classification task into a local model, on the fly — same answers, your hardware."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomer Glick" }]
keywords = ["jev", "typesafe", "distillation", "classification", "mlops", "model-cascade", "knowledge-distillation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Operating System :: OS Independent",
]
# The proxy's dependencies are part of the plain install, so `pip install jevstiller && jevstiller serve` works.
# Floors: no known advisories at these versions (pip-audit, 2026-09-25); CI tests the lowest ones.
dependencies = [
    "numpy>=1.24",
    "threadpoolctl>=3.1",
    "starlette>=1.3.1",
    "uvicorn>=0.31",
    "h11>=0.16",
    "anyio>=4.14.2",
    "httpx>=0.27",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.1"]
server = []                     # kept so `jevstiller[server,...]` still works; its packages are now in the core
onnx = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
gpu = ["onnxruntime-gpu>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
torch = ["torch>=2.1", "transformers>=4.36"]
all = ["jevstiller[jev,server,onnx,torch]"]
dev = ["pytest>=7", "ruff>=0.4", "jevstiller[jev,server]"]

[project.scripts]
jevstiller = "jevstiller._cli:main"

[project.urls]
Homepage = "https://jevstiller.pages.dev"
Documentation = "https://jevstiller.pages.dev/getting-started/"
Repository = "https://github.com/tomerglick57/Jevstiller"
Issues = "https://github.com/tomerglick57/Jevstiller/issues"
Design = "https://github.com/tomerglick57/Jevstiller/blob/main/DESIGN.md"
Changelog = "https://github.com/tomerglick57/Jevstiller/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# The README on PyPI: relative links (docs/..., DESIGN.md) point to the files on GitHub
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/tomerglick57/Jevstiller/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["jevstiller"]

[tool.hatch.build.targets.sdist]
include = ["/jevstiller", "/tests", "/README.md", "/LICENSE", "/DESIGN.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (run with JEVSTILLER_LIVE=1 and TYPESAFE_API_KEY set)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501"]
"benchmarks/*" = ["E501"]
"tests/*" = ["E501"]
