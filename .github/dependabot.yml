# The actions in .github/workflows are pinned by commit SHA; this keeps the pins current (one grouped PR a month).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The website's npm packages. A week's cooldown: a compromised release is usually caught and pulled within days,
  # before it reaches a PR here (security audit run 4).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ["*"]
  # wrangler alone, as the deploy job installs it (the job that holds the Cloudflare token).
  - package-ecosystem: npm
    directory: /website/deploy
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      deploy:
        patterns: ["*"]
