name: website
# Builds website/ (with pages generated from docs/ and README.md) and deploys it to Cloudflare Pages (project "jevstiller").
#   push to main          -> production, https://jevstiller.pages.dev
#   PR from this repo     -> preview, https://<branch>.jevstiller.pages.dev
#   PR from a fork        -> build only (forks get no secrets)
#   PR from Dependabot    -> build only (Dependabot PRs get no secrets either)
# Deploys with the wrangler CLI pinned in website/package-lock.json, the same one `npm run deploy` uses.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "README.md", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "README.md", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cut a production deploy short

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Pick the Pages branch
        id: branch
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        # Branch names go through env and are reduced to [a-zA-Z0-9-], so they can't inject into the command.
        run: echo "name=$(printf '%s' "$REF" | tr -c 'a-zA-Z0-9-' '-')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.branch.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: npx wrangler pages deploy --branch "$BRANCH"
