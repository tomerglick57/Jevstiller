name: website
# Builds website/ (with pages generated from docs/ and README.md) and deploys it to Cloudflare Pages (project "jevstiller").
#   push to main          -> production, https://jevstiller.pages.dev
#   PR from this repo     -> preview, https://<branch>.jevstiller.pages.dev
#   PR from a fork        -> build only (forks get no secrets)
#   PR from Dependabot    -> build only (Dependabot PRs get no secrets either)
# Two jobs (security audit run 4): `build` runs the site's npm dependencies (install scripts, Astro and its plugins)
# with no secrets; `deploy` holds the Cloudflare token and installs only wrangler, from website/deploy/package-lock.json
# with install scripts off, then uploads the built files. A compromised build dependency can't read the token.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "README.md", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "README.md", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cut a production deploy short

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: site
          path: website/dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            website/wrangler.jsonc
            website/deploy
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website/deploy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: site
          path: website/dist

      - name: Pick the Pages branch
        id: branch
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        # Branch names go through env and are reduced to [a-zA-Z0-9-], so they can't inject into the command.
        run: echo "name=$(printf '%s' "$REF" | tr -c 'a-zA-Z0-9-' '-')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: deploy/node_modules/.bin/wrangler pages deploy --branch "$BRANCH"
