name: release
# Push a tag vX.Y.Z on main to publish X.Y.Z to PyPI and create the GitHub release.
# PyPI trusts this workflow directly (trusted publishing), so no PyPI token is stored anywhere.
# One-time setup on pypi.org: publisher = tomerglick57/Jevstiller, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: Tag, pyproject version, and installed __version__ must agree
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install -q dist/*.whl
          installed=$(cd /tmp && /tmp/wheel-check/bin/python -c "import jevstiller; print(jevstiller.__version__)")
          [ "$installed" = "$version" ] || { echo "::error::jevstiller.__version__ is $installed, expected $version"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jevstiller/
    permissions:
      id-token: write   # the OIDC token PyPI checks instead of a password
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release with this version's CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" 'index($0, "## " v " ") == 1 {p = 1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## $version ' section in CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
