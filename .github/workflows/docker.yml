name: docker
# Every change that affects the image: build it and run deploy/smoke_test.py against it.
# A tag vX.Y.Z on main: also publish ghcr.io/tomerglick57/jevstiller:X.Y.Z (and X.Y, latest) for linux/amd64 and
# linux/arm64, with build provenance and an SBOM attached. No registry password: the job's GITHUB_TOKEN.
on:
  push:
    branches: [main]
    tags: ["v*"]                      # path filters don't apply to tag pushes
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - jevstiller/**
      - deploy/smoke_test.py
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - jevstiller/**
      - deploy/smoke_test.py
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tomerglick57/jevstiller

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: jevstiller:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python3 deploy/smoke_test.py jevstiller:smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: The tag must match the pyproject version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Jevstiller
            org.opencontainers.image.description=Drop-in Jev proxy that learns repeated classification questions and answers them locally
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
